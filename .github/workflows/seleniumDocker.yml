name: Selenium Grid Tests

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'      # change to match the version in your pom.xml
          cache: maven

      - name: Start Selenium Grid
        run: docker compose up -d   # use -f <your-file>.yml if the name differs

      - name: Wait for Grid to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:4444/status | grep -q '"ready": *true'; then
              echo "Grid is ready"; exit 0
            fi
            sleep 2
          done
          echo "Grid did not become ready"; exit 1

      - name: Run tests
        run: mvn clean test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            test-output

      - name: Stop Grid
        if: always()
        run: docker compose down